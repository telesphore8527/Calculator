<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <input type="text" readonly  id="display"></input>

        <div class="buttons">
            <button class="button" id="ac" title="double click to clear all">AC</button>
        <button class="button" id="division">/</button>
        <button class="button" id="product">&#215;</button>

        <button class="button" id="seven">7</button>
        <button class="button" id="eight">8</button>
        <button class="button" id="nine">9</button>
        <button class="button" id="soustraction">-</button>

        <button class="button" id="four">4</button>
        <button class="button" id="five">5</button>
        <button class="button" id="six">6</button>
        <button class="button" id="addition">+</button>

        <button class="button" id="one">1</button>
        <button class="button" id="two">2</button>
        <button class="button" id="three">3</button>
        
        <button class="button" id="zero">0</button>
        <button class="button" id="point">.</button>
        <button class="button" id="equal">=</button>
        </div>
    </div>
    
</body>
<script src="index.js"></script>
</html>
